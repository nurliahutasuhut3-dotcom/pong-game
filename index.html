<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pong Game</title>
  <style>
    :root {
      --bg: #0b1020;
      --panel: #111827;
      --line: #d1d5db;
      --text: #f8fafc;
      --accent: #60a5fa;
      --paddle: #f8fafc;
      --ball: #fbbf24;
      --button: #2563eb;
      --button-hover: #1d4ed8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at center, #111827, var(--bg));
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
    }

    .game-wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .scoreboard {
      width: 900px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 24px;
      font-size: 44px;
      font-weight: 700;
      letter-spacing: 2px;
    }

    .score {
      min-width: 60px;
      text-align: center;
    }

    canvas {
      display: block;
      width: 900px;
      height: 500px;
      background: rgba(15, 23, 42, 0.95);
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      cursor: none;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(11, 16, 32, 0.55);
      border-radius: 12px;
    }

    .start-btn {
      padding: 16px 28px;
      font-size: 20px;
      font-weight: 700;
      color: white;
      background: var(--button);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.2s ease;
      box-shadow: 0 10px 25px rgba(37, 99, 235, 0.4);
    }

    .start-btn:hover {
      background: var(--button-hover);
      transform: translateY(-2px);
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="game-wrapper">
    <div class="scoreboard">
      <div id="playerScore" class="score">0</div>
      <div>:</div>
      <div id="cpuScore" class="score">0</div>
    </div>

    <div style="position: relative;">
      <canvas id="gameCanvas" width="900" height="500"></canvas>
      <div id="overlay" class="overlay">
        <button id="startBtn" class="start-btn">Mulai</button>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const overlay = document.getElementById("overlay");
    const startBtn = document.getElementById("startBtn");
    const playerScoreEl = document.getElementById("playerScore");
    const cpuScoreEl = document.getElementById("cpuScore");

    const paddleWidth = 16;
    const paddleHeight = 100;
    const paddleSpeed = 7;
    const ballRadius = 10;
    const maxBallSpeed = 11;

    const leftPaddle = {
      x: 30,
      y: canvas.height / 2 - paddleHeight / 2,
      width: paddleWidth,
      height: paddleHeight,
      speed: paddleSpeed
    };

    const rightPaddle = {
      x: canvas.width - 30 - paddleWidth,
      y: canvas.height / 2 - paddleHeight / 2,
      width: paddleWidth,
      height: paddleHeight,
      speed: 5.2
    };

    let ball = {
      x: canvas.width / 2,
      y: canvas.height / 2,
      radius: ballRadius,
      vx: 5,
      vy: 4
    };

    let playerScore = 0;
    let cpuScore = 0;
    let isRunning = false;

    const keys = {
      ArrowUp: false,
      ArrowDown: false
    };

    const mouse = {
      active: false,
      y: canvas.height / 2
    };

    function clamp(value, min, max) {
      return Math.min(Math.max(value, min), max);
    }

    function resetBall(direction) {
      ball.x = canvas.width / 2;
      ball.y = canvas.height / 2;
      const angle = (Math.random() * Math.PI / 2) - Math.PI / 4;
      const speed = 5;

      ball.vx = direction * speed * Math.cos(angle);
      ball.vy = speed * Math.sin(angle);
    }

    function updateScores() {
      playerScoreEl.textContent = playerScore;
      cpuScoreEl.textContent = cpuScore;
    }

    function updatePlayerPaddle() {
      if (keys.ArrowUp && !keys.ArrowDown) {
        leftPaddle.y -= leftPaddle.speed;
      } else if (keys.ArrowDown && !keys.ArrowUp) {
        leftPaddle.y += leftPaddle.speed;
      } else if (mouse.active) {
        leftPaddle.y = mouse.y - leftPaddle.height / 2;
      }

      leftPaddle.y = clamp(leftPaddle.y, 0, canvas.height - leftPaddle.height);
    }

    function updateComputerPaddle() {
      const paddleCenter = rightPaddle.y + rightPaddle.height / 2;
      const targetY = ball.y - rightPaddle.height / 2;

      if (ball.x > canvas.width / 2) {
        if (paddleCenter < targetY) {
          rightPaddle.y += rightPaddle.speed;
        } else if (paddleCenter > targetY) {
          rightPaddle.y -= rightPaddle.speed;
        }
      }

      rightPaddle.y = clamp(rightPaddle.y, 0, canvas.height - rightPaddle.height);
    }

    function handleWallCollision() {
      if (ball.y - ball.radius <= 0) {
        ball.y = ball.radius;
        ball.vy *= -1;
      }

      if (ball.y + ball.radius >= canvas.height) {
        ball.y = canvas.height - ball.radius;
        ball.vy *= -1;
      }
    }

    function handlePaddleCollision() {
      const leftRect = {
        left: leftPaddle.x,
        right: leftPaddle.x + leftPaddle.width,
        top: leftPaddle.y,
        bottom: leftPaddle.y + leftPaddle.height
      };

      const rightRect = {
        left: rightPaddle.x,
        right: rightPaddle.x + rightPaddle.width,
        top: rightPaddle.y,
        bottom: rightPaddle.y + rightPaddle.height
      };

      if (
        ball.x - ball.radius <= leftRect.right &&
        ball.x + ball.radius >= leftRect.left &&
        ball.y >= leftRect.top &&
        ball.y <= leftRect.bottom &&
        ball.vx < 0
      ) {
        const hitPoint = (ball.y - (leftPaddle.y + leftPaddle.height / 2)) / (leftPaddle.height / 2);
        const angle = hitPoint * (Math.PI / 3);
        const speed = Math.min(Math.hypot(ball.vx, ball.vy) + 0.5, maxBallSpeed);

        ball.vx = speed * Math.cos(angle);
        ball.vy = speed * Math.sin(angle);
        ball.x = leftRect.right + ball.radius;
      }

      if (
        ball.x + ball.radius >= rightRect.left &&
        ball.x - ball.radius <= rightRect.right &&
        ball.y >= rightRect.top &&
        ball.y <= rightRect.bottom &&
        ball.vx > 0
      ) {
        const hitPoint = (ball.y - (rightPaddle.y + rightPaddle.height / 2)) / (rightPaddle.height / 2);
        const angle = hitPoint * (Math.PI / 3);
        const speed = Math.min(Math.hypot(ball.vx, ball.vy) + 0.5, maxBallSpeed);

        ball.vx = -speed * Math.cos(angle);
        ball.vy = speed * Math.sin(angle);
        ball.x = rightRect.left - ball.radius;
      }
    }

    function updateBall() {
      ball.x += ball.vx;
      ball.y += ball.vy;

      handleWallCollision();
      handlePaddleCollision();

      if (ball.x - ball.radius <= 0) {
        cpuScore += 1;
        updateScores();
        resetBall(1);
      }

      if (ball.x + ball.radius >= canvas.width) {
        playerScore += 1;
        updateScores();
        resetBall(-1);
      }
    }

    function drawBackground() {
      ctx.fillStyle = "#0f172a";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = "rgba(255,255,255,0.4)";
      ctx.setLineDash([12, 16]);
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(canvas.width / 2, canvas.height);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    function drawPaddle(x, y, w, h, color) {
      ctx.fillStyle = color;
      ctx.fillRect(x, y, w, h);
    }

    function drawBall(x, y, r) {
      ctx.fillStyle = "#fbbf24";
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
    }

    function draw() {
      drawBackground();
      drawPaddle(leftPaddle.x, leftPaddle.y, leftPaddle.width, leftPaddle.height, "#f8fafc");
      drawPaddle(rightPaddle.x, rightPaddle.y, rightPaddle.width, rightPaddle.height, "#f8fafc");
      drawBall(ball.x, ball.y, ball.radius);
    }

    function gameLoop() {
      if (isRunning) {
        updatePlayerPaddle();
        updateComputerPaddle();
        updateBall();
      }

      draw();
      requestAnimationFrame(gameLoop);
    }

    function startGame() {
      isRunning = true;
      overlay.classList.add("hidden");
      startBtn.textContent = "Mulai Lagi";
      resetBall(Math.random() > 0.5 ? 1 : -1);
    }

    document.addEventListener("keydown", (event) => {
      if (event.key === "ArrowUp") keys.ArrowUp = true;
      if (event.key === "ArrowDown") keys.ArrowDown = true;
    });

    document.addEventListener("keyup", (event) => {
      if (event.key === "ArrowUp") keys.ArrowUp = false;
      if (event.key === "ArrowDown") keys.ArrowDown = false;
    });

    canvas.addEventListener("mousemove", (event) => {
      const rect = canvas.getBoundingClientRect();
      const scaleY = canvas.height / rect.height;
      mouse.y = (event.clientY - rect.top) * scaleY;
      mouse.active = true;
    });

    canvas.addEventListener("mouseleave", () => {
      mouse.active = false;
    });

    startBtn.addEventListener("click", startGame);

    updateScores();
    resetBall(1);
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
